
name: "🚀 Update Space Shooter Game"

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/arcade.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-game:
    name: "🎮 Generate Space Shooter"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: "📁 Prepare output directory"
        shell: bash
        run: |
          mkdir -p dist

      - name: "🎮 Generate Space Shooter"
        uses: czl9707/gh-space-shooter@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: "dist/gh-space-shooter.webp"
          strategy: "random"
          no-commit: true

      - name: "👤 Configure Git"
        shell: bash
        run: |
          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"

      - name: "🔎 Verify Git identity"
        shell: bash
        run: |
          echo "Git user:"
          git config user.name

          echo
          echo "Git email:"
          git config user.email

      - name: "🔎 Check generated file"
        shell: bash
        run: |
          echo "📦 Generated file:"
          ls -lh dist/gh-space-shooter.webp

          echo
          echo "📂 Git status:"
          git status --short

      - name: "💾 Commit game update"
        id: commit
        shell: bash
        run: |
          git add -f dist/gh-space-shooter.webp

          if git diff --cached --quiet; then
            echo "ℹ️ Tidak ada perubahan pada game."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(game): update space shooter"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: "🚀 Push changes"
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          git push origin HEAD:${{ github.ref_name }}
