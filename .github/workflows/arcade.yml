name: "🚀 Update Space Shooter Game"

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/arcade.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-game:
    name: "🎮 Generate Space Shooter"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: "📁 Prepare output directory"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist

      - name: "🎮 Generate Space Shooter"
        uses: czl9707/gh-space-shooter@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: "dist/gh-space-shooter.webp"
          strategy: "random"
          no-commit: true

      - name: "🔐 Configure Git Signing"
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Validasi signing key
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::Secret COMMIT_SIGNING_KEY tidak ditemukan atau kosong."
            exit 1
          fi

          # Simpan private key sementara
          KEY_FILE="$(mktemp)"
          trap 'rm -f -- "$KEY_FILE" "${KEY_FILE}.pub"' EXIT

          printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Identitas Git
          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"

          # SSH commit signing
          git config --local gpg.format ssh
          git config --local gpg.ssh.program ssh-keygen
          git config --local user.signingkey "$KEY_FILE"
          git config --local commit.gpgsign true

          echo "✅ SSH commit signing aktif."

      - name: "🔎 Verify Git identity"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Git user:"
          git config user.name

          echo
          echo "Git email:"
          git config user.email

          echo
          echo "Signing format:"
          git config gpg.format

          echo
          echo "Commit signing:"
          git config commit.gpgsign

      - name: "🔎 Check generated file"
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "dist/gh-space-shooter.webp" ]]; then
            echo "::error::File game tidak berhasil dibuat."
            exit 1
          fi

          echo "📦 Generated file:"
          ls -lh dist/gh-space-shooter.webp

          echo
          echo "📂 Git status:"
          git status --short

      - name: "💾 Create Verified Commit"
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail

          git add -f dist/gh-space-shooter.webp

          if git diff --cached --quiet; then
            echo "ℹ️ Tidak ada perubahan pada game."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # -S memaksa commit ditandatangani
          git commit -S -m "chore(game): update space shooter"

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo
          echo "✅ Signed commit berhasil dibuat."
          git log -1 --show-signature --oneline

      - name: "🚀 Push changes"
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          git push origin "HEAD:${{ github.ref_name }}"

          echo "✅ Commit berhasil dipush."
