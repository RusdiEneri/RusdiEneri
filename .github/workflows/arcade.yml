name: "🚀 Update Space Shooter Game"

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/arcade.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-game:
    name: "🎮 Generate Space Shooter"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: "📁 Prepare output directory"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist

      - name: "🎮 Generate Space Shooter"
        uses: czl9707/gh-space-shooter@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: "dist/gh-space-shooter.webp"
          strategy: "random"
          no-commit: true

      - name: "🔐 Configure Git Signing"
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # ==========================================
          # 1. Validasi secret
          # ==========================================
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::Secret COMMIT_SIGNING_KEY tidak ditemukan atau kosong."
            exit 1
          fi

          # ==========================================
          # 2. Buat lokasi key yang tetap
          # ==========================================
          KEY_DIR="${RUNNER_TEMP}/git-signing"
          PRIVATE_KEY="${KEY_DIR}/signing_key"
          PUBLIC_KEY="${KEY_DIR}/signing_key.pub"

          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"

          # ==========================================
          # 3. Tulis private key dari GitHub Secret
          # ==========================================
          printf '%s\n' "$SIGNING_KEY" > "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"

          # ==========================================
          # 4. Generate public key dari private key
          # ==========================================
          ssh-keygen -y -f "$PRIVATE_KEY" > "$PUBLIC_KEY"
          chmod 644 "$PUBLIC_KEY"

          # ==========================================
          # 5. Validasi keypair
          # ==========================================
          if [[ ! -s "$PUBLIC_KEY" ]]; then
            echo "::error::Public signing key gagal dibuat."
            exit 1
          fi

          echo "✅ SSH keypair berhasil disiapkan."

          # ==========================================
          # 6. Configure Git identity
          # ==========================================
          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"

          # ==========================================
          # 7. Configure SSH commit signing
          # ==========================================
          git config --local gpg.format ssh
          git config --local gpg.ssh.program ssh-keygen

          # PENTING:
          # user.signingkey harus PUBLIC KEY (.pub)
          git config --local user.signingkey "$PUBLIC_KEY"

          git config --local commit.gpgsign true

          echo "✅ Git SSH signing aktif."

      - name: "🔎 Verify Git configuration"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Git user:"
          git config user.name

          echo
          echo "Git email:"
          git config user.email

          echo
          echo "Signing format:"
          git config gpg.format

          echo
          echo "Signing key:"
          git config user.signingkey

          echo
          echo "Commit signing:"
          git config commit.gpgsign

          echo
          echo "Public key:"
          cat "$(git config user.signingkey)"

      - name: "🔎 Check generated file"
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "dist/gh-space-shooter.webp" ]]; then
            echo "::error::File game tidak berhasil dibuat."
            exit 1
          fi

          echo "📦 Generated file:"
          ls -lh dist/gh-space-shooter.webp

          echo
          echo "📂 Git status:"
          git status --short

      - name: "💾 Create Verified Commit"
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail

          git add -f dist/gh-space-shooter.webp

          if git diff --cached --quiet; then
            echo "ℹ️ Tidak ada perubahan pada game."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Explicit SSH-signed commit
          git commit -S -m "chore(game): update space shooter"

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo
          echo "✅ Signed commit berhasil dibuat."

          echo
          echo "📋 Commit:"
          git log -1 --format='%h %s'

          echo
          echo "🔏 Signature:"
          git cat-file commit HEAD | sed -n '/^gpgsig /,/^$/p' || true

      - name: "🚀 Push changes"
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          git push origin "HEAD:${{ github.ref_name }}"

          echo "✅ Commit berhasil dipush."
