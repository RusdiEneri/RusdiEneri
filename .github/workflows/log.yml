name: CI - Daily System Logger

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/log.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Setup git environment
        run: |
          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

      - name: Generate Daily Log
        id: generate_log
        run: |
          TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S')"
          
          # Append log (menambahkan baris baru), bukan overwrite
          echo "[$TIMESTAMP] System health check passed. Sequence: Daily-Cron" >> system-health.log
          
          # Cek apakah ada perubahan pada file log
          if git diff --quiet system-health.log; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push (Conditional)
        if: steps.generate_log.outputs.changed == 'true'
        run: |
          git add system-health.log
          git commit -m "chore(log): daily system health check"
          
          # Push dengan retry sederhana
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin ${{ github.ref_name }} && break
            echo "Retrying push in 5s..."
            sleep 5
          done