name: "🚀 Angular Style Activity Logger"

on:
  # ⏰ Jalan setiap 5 menit
  schedule:
    - cron: "*/5 * * * *"

  # ▶️ Bisa dijalankan manual
  workflow_dispatch:

  # 🔄 Jalankan saat workflow ini diubah
  push:
    paths:
      - ".github/workflows/log.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "📝 Generate Commit Activity"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: "⚙️ Configure Git"
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"
          git config pull.rebase true

          git remote set-url origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: "📝 Update activity log"
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S')"
          ISO_TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%dT%H:%M:%S%z')"

          cat > log.txt <<EOF
          ============================================
          🚀 ANGULAR STYLE ACTIVITY LOGGER
          ============================================
          Timestamp : $TIMESTAMP
          ISO Time  : $ISO_TIMESTAMP
          Run       : #$RUN_NUMBER
          Actor     : $ACTOR
          Branch    : $BRANCH
          Status    : Success
          ============================================
          EOF

          echo "📦 Generated log:"
          cat log.txt

          git add -f log.txt

          if git diff --cached --quiet; then
            echo "ℹ️ Tidak ada perubahan pada log."
            exit 0
          fi

      - name: "💾 Create Conventional Commit"
        shell: bash
        run: |
          TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S')"

          git commit \
            -m "ci(log): refresh automated activity record" \
            -m "Update the repository activity log with the latest workflow execution." \
            -m "Automated-by: GitHub Actions" \
            -m "Generated-at: $TIMESTAMP"

      - name: "🚀 Push changes"
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "🔄 Push attempt $attempt/5..."

            if git pull --rebase origin "$BRANCH" && \
               git push origin "$BRANCH"; then
              echo "🎉 Push berhasil."
              exit 0
            fi

            echo "⚠️ Push gagal, menunggu 10 detik..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done

          echo "🚨 Push gagal setelah 5 percobaan."
          exit 1