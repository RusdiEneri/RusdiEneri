name: "🚀 Angular Style Activity Logger"

on:
  # ⏰ Jalan setiap 5 menit
  schedule:
    - cron: "*/5 * * * *"

  # ▶️ Bisa dijalankan manual
  workflow_dispatch:

  # 🔄 Jalankan saat workflow ini diubah
  push:
    paths:
      - ".github/workflows/log.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "📝 Generate Commit Activity"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: "⚙️ Configure Git"
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"
          git config pull.rebase true

          git remote set-url origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: "📝 Update activity log"
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S')"
          ISO_TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%dT%H:%M:%S%z')"

          # 🎲 Random index
          INDEX="$(shuf -i 0-9 -n 1)"

          # 🎲 Random operational data
          COMPONENTS=(
            "API Gateway"
            "Web Application"
            "Background Worker"
            "Database Layer"
            "Authentication Service"
            "Notification Service"
            "CI Pipeline"
            "Asset Pipeline"
            "Repository Metadata"
            "Monitoring Job"
          )

          ACTIONS=(
            "synchronized repository metadata"
            "refreshed runtime configuration"
            "updated service activity records"
            "completed routine maintenance"
            "validated automation state"
            "refreshed generated artifacts"
            "synchronized build metadata"
            "updated internal tracking data"
            "completed scheduled housekeeping"
            "verified pipeline execution"
          )

          STATUSES=(
            "Completed"
            "Success"
            "Healthy"
            "Stable"
            "Processed"
            "Verified"
            "Synchronized"
            "Up to date"
            "Operational"
            "No issues detected"
          )

          NOTES=(
            "No manual intervention required."
            "All automated checks completed normally."
            "Repository state is synchronized with the remote branch."
            "No pending maintenance actions were detected."
            "Routine automation completed within the expected window."
            "Generated as part of the scheduled engineering workflow."
            "No blocking conditions were reported."
            "All expected workflow tasks completed successfully."
            "Automation cycle completed without interruption."
            "Repository metadata remains consistent."
          )

          COMPONENT="${COMPONENTS[$INDEX]}"
          ACTION="${ACTIONS[$INDEX]}"
          STATUS="${STATUSES[$INDEX]}"
          NOTE="${NOTES[$INDEX]}"

          # 🎲 Random operational values
          DURATION_MS="$(shuf -i 180-4200 -n 1)"
          JOB_ID="OPS-$(printf '%04d' "$RANDOM")"

          cat > log.txt <<EOF
          ============================================
          🚀 ENGINEERING ACTIVITY RECORD
          ============================================
          Timestamp   : $TIMESTAMP
          ISO Time    : $ISO_TIMESTAMP
          Run         : #$RUN_NUMBER
          Job ID      : $JOB_ID
          Actor       : $ACTOR
          Branch      : $BRANCH
          Component   : $COMPONENT
          Action      : $ACTION
          Status      : $STATUS
          Duration    : ${DURATION_MS}ms
          Environment : CI
          Note        : $NOTE
          ============================================
          EOF

          echo "📦 Generated log:"
          cat log.txt

          git add -f log.txt

          if git diff --cached --quiet; then
            echo "ℹ️ Tidak ada perubahan pada log."
            exit 0
          fi

      - name: "💾 Create Random Conventional Commit"
        shell: bash
        run: |
          set -euo pipefail

          # 🎲 Random commit message
          COMMIT_SUBJECTS=(
            "chore(ops): refresh routine activity record"
            "ci(log): update automated execution metadata"
            "build(meta): synchronize generated repository data"
            "chore(ci): update scheduled workflow state"
            "docs(meta): refresh internal activity snapshot"
            "ci(maintenance): record scheduled pipeline activity"
            "chore(automation): refresh repository status log"
            "build(ci): update automation tracking record"
            "chore(metadata): synchronize latest activity state"
            "ci(ops): record routine engineering activity"
          )

          COMMIT_BODIES=(
            "Refresh the activity record generated by the scheduled engineering workflow."
            "Update automated execution metadata and repository activity information."
            "Synchronize generated metadata with the latest workflow execution."
            "Record the latest scheduled automation cycle in the repository log."
            "Refresh internal activity information generated by CI automation."
            "Update the repository activity snapshot from the current workflow run."
            "Record routine pipeline activity and maintain current repository metadata."
            "Synchronize the latest automation state with the repository activity log."
            "Update generated operational metadata from the latest scheduled execution."
            "Record the completed automation cycle for repository tracking purposes."
          )

          INDEX="$(shuf -i 0-9 -n 1)"

          SUBJECT="${COMMIT_SUBJECTS[$INDEX]}"
          BODY="${COMMIT_BODIES[$INDEX]}"
          TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S')"

          git commit \
            -m "$SUBJECT" \
            -m "$BODY" \
            -m "Automated-by: GitHub Actions" \
            -m "Generated-at: $TIMESTAMP"

      - name: "🚀 Push changes"
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "🔄 Push attempt $attempt/5..."

            if git pull --rebase origin "$BRANCH" && \
               git push origin "$BRANCH"; then
              echo "🎉 Push berhasil."
              exit 0
            fi

            echo "⚠️ Push gagal, menunggu 10 detik..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done

          echo "🚨 Push gagal setelah 5 percobaan."
          exit 1