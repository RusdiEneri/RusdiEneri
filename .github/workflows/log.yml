name: "🚀 Galactic Mission Operations Logger"

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/log.yml"

permissions:
  contents: write

concurrency:
  group: "mission-logger-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  generate-log:
    name: "🛰️ Generate Mission Log"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📦 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📝 Generate 5 Mission Commits & Push Once"
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Validasi private key
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::Secret COMMIT_SIGNING_KEY tidak ditemukan atau kosong."
            exit 1
          fi

          # Setup SSH signing key
          KEY_FILE="$(mktemp)"
          trap 'rm -f -- "$KEY_FILE"' EXIT

          printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"
          git config gpg.format ssh
          git config user.signingkey "$KEY_FILE"
          git config commit.gpgsign true

          # Sinkronisasi branch sebelum membuat commit
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          mkdir -p dist

          COMPONENTS=(
            "Quantum Core"
            "Warp Drive"
            "Navigation AI"
            "Life Support"
            "Shield Generator"
            "Ion Thrusters"
            "Comms Array"
            "Stellar Cartography"
          )

          ACTIONS=(
            "calibrated"
            "optimized"
            "updated"
            "stabilized"
            "reconfigured"
            "verified"
            "synchronized"
            "monitored"
          )

          MESSAGES=(
            "Systems operating within nominal parameters."
            "Routine maintenance cycle completed successfully."
            "Telemetry remains stable across monitored systems."
            "All automated validation checks passed."
            "Mission services remain synchronized."
            "No operational anomalies detected."
          )

          # Buat 5 commit secara lokal
          for i in {1..5}; do
            COMPONENT_INDEX=$((RANDOM % ${#COMPONENTS[@]}))
            ACTION_INDEX=$((RANDOM % ${#ACTIONS[@]}))
            MESSAGE_INDEX=$((RANDOM % ${#MESSAGES[@]}))

            COMPONENT="${COMPONENTS[$COMPONENT_INDEX]}"
            ACTION="${ACTIONS[$ACTION_INDEX]}"
            MESSAGE="${MESSAGES[$MESSAGE_INDEX]}"

            TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S %Z')"
            SHORT_SHA="${SHA:0:7}"

            cat > dist/log.md <<EOF
            # 🚀 Galactic Mission Operations Log
            
            > Automated operational report generated by GitHub Actions.
            
            | Field | Value |
            |---|---|
            | **Timestamp** | \`${TIMESTAMP}\` |
            | **Iteration** | \`Batch #${i} of 5\` |
            | **Run** | \`#${RUN_NUMBER}\` |
            | **Run ID** | \`${RUN_ID}\` |
            | **Branch** | \`${BRANCH}\` |
            | **Commit Target** | \`${SHORT_SHA}\` |
            | **Triggered By** | \`${ACTOR}\` |
            | **Event** | \`${EVENT}\` |
            | **Environment** | \`ubuntu-latest\` |
            
            ## 🛰️ Operational Event
            
            **${COMPONENT}** was **${ACTION}**.
            
            > ${MESSAGE}
            
            ## ✅ Mission Status
            
            \`OPERATIONAL\`
            
            ---
            
            *Generated automatically by the Galactic Mission Operations pipeline.*
            EOF

            git add -f dist/log.md

            # Pastikan ada perubahan sebelum commit
            if git diff --cached --quiet; then
              echo "Iteration #${i}: tidak ada perubahan, commit dilewati."
              continue
            fi

            git commit -m "chore(ops): refresh mission log [cycle ${i}/5]"

            echo "✅ Local commit ${i}/5 berhasil dibuat."
          done

          echo
          echo "📋 Commit lokal yang akan dipush:"
          git log -5 --oneline

          echo
          echo "🚀 Push 5 commit sekaligus..."
          git push origin "HEAD:${BRANCH}"

          echo "✅ Semua commit berhasil dipush."
