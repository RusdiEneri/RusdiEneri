name: CI - Angular Style Logger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/log.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup git and branch tracking
        env:
          BRANCH: ${{ github.ref_name }}
          GIT_USER: ${{ github.actor }}
          GIT_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "$GIT_USER"
          git config user.email "$GIT_EMAIL"
          git config pull.rebase true
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: Create 10 Conventional Commits and Push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Array berdasarkan pedoman Angular (Conventional Commits)
          TYPES=("ci" "docs" "style" "refactor" "perf")
          SCOPES=("log" "workflow" "changelog" "actions" "ci")
          SUBJECTS=(
            "update log file with latest timestamp"
            "add new entry to execution log"
            "refresh log output sequence"
            "sync log with current runner time"
            "generate new log cycle"
            "append current timestamp to log"
            "rebuild log file structure"
            "update ci execution log status"
            "record workflow execution time"
            "format log output properly"
          )

          echo "🔄 Memulai generasi 10 commit standar Angular..."

          for i in {1..10}; do
            TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S')"
            
            # Pick Random dari array
            RAND_TYPE=${TYPES[$RANDOM % ${#TYPES[@]}]}
            RAND_SCOPE=${SCOPES[$RANDOM % ${#SCOPES[@]}]}
            RAND_SUBJECT=${SUBJECTS[$RANDOM % ${#SUBJECTS[@]}]}

            # 1. Header (Wajib): <type>(<scope>): <subject>
            COMMIT_HEADER="$RAND_TYPE($RAND_SCOPE): $RAND_SUBJECT"
            
            # 2. Body (Opsional tapi disarankan): Motivasi perubahan
            COMMIT_BODY="Automated log sequence $i/10 generated by GitHub Actions."
            
            # 3. Footer (Opsional): Referensi waktu/metadata
            COMMIT_FOOTER="Generated-at: $TIMESTAMP"

            # Isi log.txt dengan format simpel (menggunakan printf untuk menghindari error indentasi EOF di YAML)
            printf "Timestamp: %s\nSequence: %s/10\nStatus: Success\n" "$TIMESTAMP" "$i" > log.txt

            git add log.txt
            
            # Git native multi-line commit: setiap -m akan otomatis dipisah oleh baris kosong (sesuai standar Angular)
            git commit -m "$COMMIT_HEADER" -m "$COMMIT_BODY" -m "$COMMIT_FOOTER"

            sleep 1
          done

          echo "✅ 10 commit konvensional berhasil dibuat. Melakukan push..."

          for attempt in 1 2 3 4 5; do
            echo "🔄 Push attempt $attempt/5..."

            if git pull --rebase origin "$BRANCH"; then
              if git push origin "$BRANCH"; then
                echo "🎉 Push berhasil pada percobaan ke-$attempt."
                exit 0
              fi
            else
              echo "⚠️ Rebase gagal, membatalkan rebase..."
              git rebase --abort || true
            fi

            echo "❌ Push gagal, menunggu 10 detik..."
            sleep 10
          done

          echo "🚨 Push gagal setelah 5 percobaan."
          exit 1