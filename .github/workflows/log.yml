name: "🚀 Galactic Mission Logger"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/log.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate log
        env:
          RUN: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -e

          COMPONENTS=(
            "Quantum Core"
            "Warp Drive"
            "Navigation AI"
            "Life Support"
            "Shield Generator"
            "Ion Thrusters"
            "Comms Array"
            "Stellar Cartography"
          )

          ACTIONS=(
            "calibrated"
            "optimized"
            "updated"
            "stabilized"
            "reconfigured"
            "verified"
            "synchronized"
            "monitored"
          )

          MESSAGES=(
            "Systems operating normally."
            "Routine maintenance completed."
            "Telemetry remains stable."
            "All checks passed."
            "Mission systems synchronized."
            "No anomalies detected."
          )

          I=$((RANDOM % ${#COMPONENTS[@]}))
          TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S')"

          printf '%s | run #%s | %s %s | %s\n' \
            "$TIMESTAMP" \
            "$RUN" \
            "${ACTIONS[$I]}" \
            "${COMPONENTS[$I]}" \
            "${MESSAGES[$I]}" > log.txt

          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          git add log.txt
          git commit -m "chore: update mission log"

      - name: Push
        run: git push origin HEAD:${{ github.ref_name }}