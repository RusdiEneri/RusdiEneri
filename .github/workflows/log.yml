name: "🚀 Galactic Mission Operations Logger"

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/log.yml"

permissions:
  contents: write

concurrency:
  group: "mission-logger-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  generate-log:
    name: "🛰️ Generate Mission Log"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📦 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🧭 Generate operational log"
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          COMPONENTS=(
            "Quantum Core"
            "Warp Drive"
            "Navigation AI"
            "Life Support"
            "Shield Generator"
            "Ion Thrusters"
            "Comms Array"
            "Stellar Cartography"
          )

          ACTIONS=(
            "calibrated"
            "optimized"
            "updated"
            "stabilized"
            "reconfigured"
            "verified"
            "synchronized"
            "monitored"
          )

          MESSAGES=(
            "Systems operating within nominal parameters."
            "Routine maintenance cycle completed successfully."
            "Telemetry remains stable across monitored systems."
            "All automated validation checks passed."
            "Mission services remain synchronized."
            "No operational anomalies detected."
          )

          COMPONENT_INDEX=$((RANDOM % ${#COMPONENTS[@]}))
          ACTION_INDEX=$((RANDOM % ${#ACTIONS[@]}))
          MESSAGE_INDEX=$((RANDOM % ${#MESSAGES[@]}))

          COMPONENT="${COMPONENTS[$COMPONENT_INDEX]}"
          ACTION="${ACTIONS[$ACTION_INDEX]}"
          MESSAGE="${MESSAGES[$MESSAGE_INDEX]}"

          TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S %Z')"
          SHORT_SHA="${SHA:0:7}"

          mkdir -p dist

          cat > dist/log.md <<EOF
          # 🚀 Galactic Mission Operations Log

          > Automated operational report generated by GitHub Actions.

          | Field | Value |
          |---|---|
          | **Timestamp** | \`${TIMESTAMP}\` |
          | **Run** | \`#${RUN_NUMBER}\` |
          | **Run ID** | \`${RUN_ID}\` |
          | **Branch** | \`${BRANCH}\` |
          | **Commit** | \`${SHORT_SHA}\` |
          | **Triggered By** | \`${ACTOR}\` |
          | **Event** | \`${EVENT}\` |
          | **Environment** | \`ubuntu-latest\` |

          ## 🛰️ Operational Event

          **${COMPONENT}** was **${ACTION}**.

          > ${MESSAGE}

          ## ✅ Mission Status

          \`OPERATIONAL\`

          ---
          *Generated automatically by the Galactic Mission Operations pipeline.*
          EOF

      - name: "🔍 Verify generated artifact"
        run: |
          test -s dist/log.md
          echo "Generated $(wc -c < dist/log.md) bytes."
          sed -n '1,40p' dist/log.md

      - name: "📝 Commit operational log"
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          git add dist/log.md

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "chore(ops): refresh mission log"

      - name: "🚀 Push changes"
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"