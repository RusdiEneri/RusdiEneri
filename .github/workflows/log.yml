name: "🚀 Galactic Mission Operations Logger"

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/log.yml"

permissions:
  contents: write

concurrency:
  group: "mission-logger-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  generate-log:
    name: "🛰️ Generate Mission Log"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📦 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "📝 Generate 5 Signed Commits & Push Once"
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # ==========================================
          # 1. Validasi private signing key
          # ==========================================
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::Secret COMMIT_SIGNING_KEY tidak ditemukan atau kosong."
            exit 1
          fi

          # ==========================================
          # 2. Simpan private key sementara
          # ==========================================
          KEY_FILE="$(mktemp)"

          cleanup() {
            rm -f -- "$KEY_FILE"
          }

          trap cleanup EXIT

          printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # ==========================================
          # 3. Configure Git identity + SSH signing
          # ==========================================
          git config --local user.name "RusdiEneri"
          git config --local user.email "nuruddinrusydiilham@gmail.com"

          git config --local gpg.format ssh
          git config --local gpg.ssh.program ssh-keygen
          git config --local user.signingkey "$KEY_FILE"
          git config --local commit.gpgsign true

          echo "✅ Git identity:"
          git config --local user.name
          git config --local user.email

          echo "✅ Signing format:"
          git config --local gpg.format

          # ==========================================
          # 4. Sinkronisasi branch sebelum commit
          # ==========================================
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          # ==========================================
          # 5. Prepare output
          # ==========================================
          mkdir -p dist

          COMPONENTS=(
            "Quantum Core"
            "Warp Drive"
            "Navigation AI"
            "Life Support"
            "Shield Generator"
            "Ion Thrusters"
            "Comms Array"
            "Stellar Cartography"
          )

          ACTIONS=(
            "calibrated"
            "optimized"
            "updated"
            "stabilized"
            "reconfigured"
            "verified"
            "synchronized"
            "monitored"
          )

          MESSAGES=(
            "Systems operating within nominal parameters."
            "Routine maintenance cycle completed successfully."
            "Telemetry remains stable across monitored systems."
            "All automated validation checks passed."
            "Mission services remain synchronized."
            "No operational anomalies detected."
          )

          # ==========================================
          # 6. Generate 5 local signed commits
          # ==========================================
          for i in {1..5}; do

            COMPONENT_INDEX=$((RANDOM % ${#COMPONENTS[@]}))
            ACTION_INDEX=$((RANDOM % ${#ACTIONS[@]}))
            MESSAGE_INDEX=$((RANDOM % ${#MESSAGES[@]}))

            COMPONENT="${COMPONENTS[$COMPONENT_INDEX]}"
            ACTION="${ACTIONS[$ACTION_INDEX]}"
            MESSAGE="${MESSAGES[$MESSAGE_INDEX]}"

            TIMESTAMP="$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S %Z')"
            SHORT_SHA="${SHA:0:7}"

            cat > dist/log.md <<EOF
          # 🚀 Galactic Mission Operations Log
          
          > Automated operational report generated by GitHub Actions.
          
          | Field | Value |
          |---|---|
          | **Timestamp** | \`${TIMESTAMP}\` |
          | **Iteration** | \`Batch #${i} of 5\` |
          | **Run** | \`#${RUN_NUMBER}\` |
          | **Run ID** | \`${RUN_ID}\` |
          | **Branch** | \`${BRANCH}\` |
          | **Commit Target** | \`${SHORT_SHA}\` |
          | **Triggered By** | \`${ACTOR}\` |
          | **Event** | \`${EVENT}\` |
          | **Environment** | \`ubuntu-latest\` |
          
          ## 🛰️ Operational Event
          
          **${COMPONENT}** was **${ACTION}**.
          
          > ${MESSAGE}
          
          ## ✅ Mission Status
          
          \`OPERATIONAL\`
          
          ---
          
          *Generated automatically by the Galactic Mission Operations pipeline.*
          EOF

            # ======================================
            # 7. Stage generated log
            # ======================================
            git add -f dist/log.md

            # ======================================
            # 8. Pastikan ada perubahan
            # ======================================
            if git diff --cached --quiet; then
              echo "⚠️ Iteration #${i}: tidak ada perubahan."
              continue
            fi

            # ======================================
            # 9. Signed commit
            # ======================================
            git commit -S \
              -m "chore(ops): refresh mission log [cycle ${i}/5]"

            echo "✅ Signed local commit ${i}/5 berhasil dibuat."

          done

          # ==========================================
          # 10. Tampilkan commit lokal
          # ==========================================
          echo
          echo "=========================================="
          echo "📋 Local commits sebelum push"
          echo "=========================================="

          git log -5 --pretty=format:'%h | %s | %an <%ae>'

          echo

          # ==========================================
          # 11. Pastikan ada commit untuk dipush
          # ==========================================
          if git diff "origin/${BRANCH}..HEAD" --quiet; then
            echo "ℹ️ Tidak ada commit baru untuk dipush."
            exit 0
          fi

          # ==========================================
          # 12. Push SEMUA commit sekaligus
          # ==========================================
          echo
          echo "🚀 Push seluruh commit sekaligus..."

          git push origin "HEAD:${BRANCH}"

          echo "✅ Semua commit berhasil dipush."
