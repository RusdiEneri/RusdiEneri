name: Generate GitHub Stats Images

on:
  schedule:
    - cron: '0 * * * *'   # Setiap 6 jam (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:         # Bisa trigger manual dari tab Actions

permissions:
  contents: write            # Izin push/commit ke repo

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create dist folder
        run: mkdir -p dist

      - name: Download GitHub Stats
        run: |
          curl -sL --retry 3 --retry-delay 5 \
            "https://github-stats-extended.vercel.app/api?username=RusdiEneri&show_icons=true&include_all_commits=true&count_private=true&theme=radical&hide_border=false" \
            -o dist/github-stats.svg

      - name: Download Streak Stats
        run: |
          curl -sL --retry 3 --retry-delay 5 \
            "https://streak-stats.demolab.com/?user=RusdiEneri&theme=radical&hide_border=false&fire=f472b6" \
            -o dist/streak-stats.svg

      - name: Download Top Languages
        run: |
          curl -sL --retry 3 --retry-delay 5 \
            "https://github-stats-extended.vercel.app/api/top-langs/?username=RusdiEneri&theme=radical&hide_border=false&layout=compact&langs_count=8" \
            -o dist/top-langs.svg

      - name: Download Spotify Profile
        run: |
          curl -sL --retry 3 --retry-delay 5 \
            "https://spotify-github-profile.kittinanx.com/api/view?uid=31mfyohm4whu5nih4jejt6i36pgi&cover_image=true&theme=spotify-embed&show_offline=true&background_color=000000&interchange=true&profanity=true&hide_remaster=true" \
            -o dist/spotify.svg

      - name: Download Activity Graph
        run: |
          curl -sL --retry 3 --retry-delay 5 \
            "https://github-readme-activity-graph.vercel.app/graph?username=RusdiEneri&theme=radical&hide_border=true&area=true" \
            -o dist/activity-graph.svg

      - name: Verify downloads
        run: |
          echo "=== File sizes ==="
          ls -lh dist/
          # Cek apakah file bukan error page (minimal 1KB)
          for f in dist/*.svg; do
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -lt 1000 ]; then
              echo "⚠️ WARNING: $f terlalu kecil ($SIZE bytes), kemungkinan gagal download"
            else
              echo "✅ $f OK ($SIZE bytes)"
            fi
          done

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 chore: update stats images"
          file_pattern: "dist/"
          commit_user_name: "RusdiEneri"
          commit_user_email: "nuruddinrusydiilham@gmail.com"
