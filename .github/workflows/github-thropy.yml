name: Update GitHub Trophy

on:
  schedule:
    - cron: "0 */12 * * *"
      timezone: "Asia/Jakarta"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/github-thropy.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo profile RusdiEneri/RusdiEneri
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # Checkout source github-profile-trophy
      - name: Checkout trophy source
        uses: actions/checkout@v6
        with:
          repository: RusdiEneri/github-profile-trophy
          ref: master
          path: trophy-source

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophy
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deno run \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            ./trophy-source/render_svg.ts \
            RusdiEneri \
            ./dist/trophy.svg \
            radical

      - name: Commit trophy
        run: |
          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          git add dist/trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub Trophy"
          git push