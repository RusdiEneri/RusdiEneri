name: Update Timestamp Log

on:
  schedule:
    # Tiap 5 menit.
    # Kalau mau lebih aman/hemat: pakai "0 * * * *" tiap jam,
    # atau "0 0 * * *" sekali sehari pada 00:00 UTC / 07:00 WIB.
    - cron: "*/5 * * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/timestamp.yml"

permissions:
  contents: write

concurrency:
  group: timestamp-log-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Kalau cuma mau update file, GITHUB_TOKEN cukup:
          # token: ${{ secrets.GITHUB_TOKEN }}
          #
          # Kalau mau peluang masuk contribution graph, pakai PAT:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Sync to latest branch
        run: |
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Write timestamp to log.txt
        run: |
          {
            echo "Last updated: $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M:%S WIB')"
            echo "Run id: $GITHUB_RUN_ID"
          } > log.txt

      - name: Commit and push
        run: |
          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          git add log.txt

          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "chore: update timestamp $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M WIB')"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
