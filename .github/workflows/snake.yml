name: Generate Snake

on:
  schedule:
    - cron: "0 * * * *"

  push:
    paths:
      - ".github/workflows/snake.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    # Ignore commits generated by this workflow itself.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Pull BEFORE generating/modifying snake.svg.
      - name: Sync with main
        run: |
          set -euo pipefail

          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          git fetch origin main
          git rebase origin/main

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RusdiEneri
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: Add generation timestamp
        run: |
          set -euo pipefail

          TIMESTAMP="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          RUN_ID="${GITHUB_RUN_ID}"

          sed -i \
            "s#</svg>#<!-- generated: ${TIMESTAMP} | run: ${RUN_ID} -->\n</svg>#" \
            dist/snake.svg

      - name: Commit & push
        run: |
          set -euo pipefail

          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          git add dist/snake.svg

          # Timestamp + run ID guarantees a change every run.
          git commit -m "chore: update github-snake [skip ci]"

          git push origin HEAD:main
