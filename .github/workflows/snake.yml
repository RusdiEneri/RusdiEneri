name: Generate Snake

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # Anti-loop: skip kalau commit pemicu adalah commit snake otomatis
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # pakai GITHUB_TOKEN biar anti-loop

      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: RusdiEneri
          outputs: |
            dist/snake.svg

      - name: Commit & push ke main sebagai RusdiEneri
        run: |
          set -euo pipefail

          # Identitas author = kamu (email noreply verified)
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add dist/snake.svg

          # Kalau nggak ada perubahan, jangan commit (biar run nggak error)
          if git diff --cached --quiet; then
            echo "snake.svg tidak berubah, skip commit"
            exit 0
          fi

          git commit -m "chore: update github-snake [skip ci]"
          git push origin HEAD:main
