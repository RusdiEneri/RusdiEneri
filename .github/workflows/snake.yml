name: Generate Snake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:


permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # Anti-loop: skip kalau commit pemicu adalah commit otomatis
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # GITHUB_TOKEN = anti-loop

      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: RusdiEneri
          outputs: |
            dist/snake.svg

      - name: Commit & push ke main sebagai RusdiEneri
        run: |
          set -euo pipefail

          # Identitas HARDCODE (jangan pakai github.actor — bisa jadi bot untuk schedule)
          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          git add dist/snake.svg

          if git diff --cached --quiet; then
            echo "snake.svg tidak berubah, skip commit"
            exit 0
          fi

          git commit -m "chore: update github-snake [skip ci]"
          git push origin HEAD:main
