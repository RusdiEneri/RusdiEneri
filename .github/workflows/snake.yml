name: Generate Snake

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - ".github/workflows/snake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Diperlukan untuk git pull --rebase

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RusdiEneri
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: Commit & push
        run: |
          set -euo pipefail

          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          # Timestamp → menjamin file selalu berbeda
          echo "<!-- generated: $(date -u +%Y-%m-%dT%H:%M:%SZ) -->" >> dist/snake.svg

          git add dist/snake.svg
          
          # ✅ Cek apakah benar-benar ada perubahan sebelum commit
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping."
            exit 0
          fi
          
          git commit -m "chore: update github-snake [skip ci]"
          
          # ✅ WAJIB: Pull rebase untuk mencegah gagal push jika workflow lain (streak/quote) push di waktu yang sama
          git pull --rebase origin main
          git push origin HEAD:main
