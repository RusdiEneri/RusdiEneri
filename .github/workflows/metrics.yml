name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"     # tiap 6 jam (lebih aman dari rate-limit)
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token API (scope: repo, read:user, read:org, read:packages — classic PAT)
          token: ${{ secrets.METRICS_TOKEN }}

          # ====== Identitas commit (author = kamu) ======
          committer: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          committer_token: ${{ secrets.GITHUB_TOKEN }}   # anti-loop; jangan ganti PAT

          # ====== Hardening ======
          retries: 3
          plugins_errors_fatal: no   # hapus/ubah yes kalau udah stabil

          # ====== Konfigurasi dasar ======
          user: RusdiEneri
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta

          # ====== Introduction ======
          plugin_introduction: yes
          plugin_introduction_title: yes

          # ====== Kalender kontribusi ======
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ====== Bahasa pemrograman ======
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used, recently-used
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes

          # ====== Followers / following ======
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following

          # ====== Stars ======
          plugin_stars: yes
          plugin_stars_limit: 4

          # ====== Tambahan ======
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_topics: yes
          plugin_topics_limit: 8
          plugin_topics_mode: icons

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: all

          plugin_lines: yes
