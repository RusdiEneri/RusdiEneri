name: Metrics
on:
  # Schedule daily updates (setiap jam 00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Run workflow manually
  workflow_dispatch:
  # Run workflow when pushing on master/main
  push:
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token utama untuk mengambil data akun
          token: ${{ secrets.STATS_PAT }}
          
          # Token khusus commit agar tercatat atas nama pemilik token (RusdiEneri)
          committer_token: ${{ secrets.STATS_PAT }}
          
          # Pesan commit dengan timestamp otomatis (Tanggal & Waktu)
          committer_message: "chore: update metrics [%Y-%m-%d %H:%M:%S UTC]"
          
          # Nama pengguna GitHub Anda
          user: RusdiEneri
          
          # Branch tempat file metrics akan di-commit
          committer_branch: main
