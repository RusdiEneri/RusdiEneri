name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STATS_PAT }}
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config --global user.name "RusdiEneri"
          git config --global user.email "nuruddinrusydiilham@gmail.com"

      - name: Get timestamp
        id: ts
        run: |
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Save current HEAD
        id: before
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_PAT }}
          committer_token: ${{ secrets.STATS_PAT }}
          filename: dist/metrics.svg
          commit_message: "chore: update metrics - ${{ steps.ts.outputs.timestamp }}"

      - name: Ensure commit exists even if metrics unchanged
        env:
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
          TIMESTAMP: ${{ steps.ts.outputs.timestamp }}
          GIT_AUTHOR_NAME: "RusdiEneri"
          GIT_AUTHOR_EMAIL: "nuruddinrusydiilham@gmail.com"
          GIT_COMMITTER_NAME: "RusdiEneri"
          GIT_COMMITTER_EMAIL: "nuruddinrusydiilham@gmail.com"
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          REMOTE_SHA=$(git rev-parse HEAD)

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): update metrics - $TIMESTAMP"
            git push origin main
          elif [ "$BEFORE_SHA" = "$REMOTE_SHA" ]; then
            git commit --allow-empty -m "chore(metrics): run - $TIMESTAMP"
            git push origin main
          else
            echo "Sudah ada commit dari metrics, empty commit dilewati."
          fi
