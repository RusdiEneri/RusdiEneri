name: Update Awesome GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
      timezone: "Asia/Jakarta"
  push:
    paths:
      - ".github/workflows/awesome-stats-local.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Clone Awesome GitHub Stats
        run: |
          git clone --depth 1 \
            https://github.com/brunobritodev/awesome-github-stats.git \
            /tmp/awesome-github-stats

      - name: Generate stats SVG
        env:
          PATS__0: ${{ secrets.GITHUB_TOKEN }}
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          set -e

          cd /tmp/awesome-github-stats

          dotnet restore \
            src/AwesomeGithubStats.Api/AwesomeGithubStats.Api.csproj

          dotnet run \
            --project src/AwesomeGithubStats.Api/AwesomeGithubStats.Api.csproj \
            --no-launch-profile \
            --urls http://127.0.0.1:5050 \
            > /tmp/awesome-github-stats.log 2>&1 &

          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          echo "Waiting for API..."

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5050/health > /dev/null; then
              echo "API is ready."
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "API process exited unexpectedly."
              cat /tmp/awesome-github-stats.log
              exit 1
            fi

            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:5050/health > /dev/null; then
            echo "API failed to start."
            cat /tmp/awesome-github-stats.log
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          curl -fL \
            "http://127.0.0.1:5050/user-stats/RusdiEneri?cardType=level&theme=radical&fontFamily=Poppins&preferLogin=true" \
            -o "$GITHUB_WORKSPACE/dist/awesome-github-stats.svg"

          echo "Generated:"
          ls -lh "$GITHUB_WORKSPACE/dist/awesome-github-stats.svg"

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/awesome-github-stats.svg

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update awesome github stats [skip ci]"
          git push