name: Fetch Visitor Counter

on:
  schedule:
    - cron: "0 * * * *"     # tiap jam (ganti "0 */6 * * *" kalau mau tiap 6 jam)
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Anti-loop: skip kalau commit pemicu adalah commit otomatis
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # GITHUB_TOKEN = anti-loop

      - name: Hit & download counter badge
        run: |
          set -euo pipefail
          mkdir -p dist

          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 60 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Referer: https://github.com/" \
            -o dist/counter.svg \
            "https://count.getloli.com/@RusdiEneri?name=RusdiEneri&theme=booru-r6gdrawfriends"

          echo "--- hasil download (potongan) ---"
          head -c 300 dist/counter.svg || true

      - name: Commit & push sebagai RusdiEneri
        run: |
          set -euo pipefail

          # Identitas HARDCODE (jangan pakai github.actor — untuk schedule bisa jadi bot)
          git config user.name "RusdiEneri"
          git config user.email "80238228+RusdiEneri@users.noreply.github.com"

          git add dist/counter.svg
          if git diff --cached --quiet; then
            echo "counter tidak berubah, skip commit (tapi hit tetap bertambah)"
            exit 0
          fi

          git commit -m "chore: refresh visitor counter [skip ci]"
          git push origin HEAD:main
