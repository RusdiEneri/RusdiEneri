name: "Update Profile Art"

on:
  schedule:
    - cron: "0 0 * * *"   # Daily at 00:00 UTC (~07:00 WIB)
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate profile art
        run: |
          python scripts/fetch_contributions.py
          python scripts/generate_heatmap_svg.py
          python scripts/render_stats_svg.py
          python scripts/render_sys_svg.py

      - name: Commit updated art
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"

          if [[ -n "${SIGNING_KEY:-}" ]]; then
            KEY_FILE="$(mktemp)"
            printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            git config gpg.format ssh
            git config gpg.ssh.program ssh-keygen
            git config user.signingkey "$KEY_FILE"
            git config commit.gpgsign true
          fi

          git add data/contributions.json dist/*.svg
          git diff --staged --quiet && exit 0

          git commit -m "chore: refresh contribution graph & profile stats [skip ci]"

          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" || true
            if git push origin "$BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
