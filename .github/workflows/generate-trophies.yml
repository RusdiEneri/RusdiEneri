name: Generate GitHub Trophies

on:
  schedule:
    - cron: '0 * * * *'   # Setiap 12 jam (trophies jarang berubah)
  workflow_dispatch:          # Trigger manual

permissions:
  contents: write

jobs:
  fetch-trophies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create dist folder
        run: mkdir -p dist

      - name: Download GitHub Trophies
        run: |
          curl -sL --retry 3 --retry-delay 5 \
            --max-time 60 \
            "https://trophy.benkou.dev/?username=RusdiEneri&theme=radical&no-frame=true&row=1&column=7" \
            -o dist/github-trophies.svg

      - name: Verify download
        run: |
          SIZE=$(stat -c%s dist/github-trophies.svg)
          echo "File size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "⚠️ WARNING: File terlalu kecil, kemungkinan gagal download"
            echo "--- Preview ---"
            head -c 500 dist/github-trophies.svg
            exit 1
          else
            echo "✅ github-trophies.svg OK ($SIZE bytes)"
          fi

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🏆 chore: update trophies image"
          file_pattern: "dist/github-trophies.svg"
          commit_user_name: "RusdiEneri"
          commit_user_email: "nuruddinrusydiilham@gmail.com"
