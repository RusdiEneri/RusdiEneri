name: Fetch GitHub Profile Card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# ✅ TAMBAHKAN INI
permissions:
  contents: write

jobs:
  fetch-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ✅ Gunakan token agar bisa push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dist folder
        run: mkdir -p dist

      - name: Download productive-time card
        run: |
          curl -s -o dist/productive-time.svg \
            "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=RusdiEneri&theme=github_dark&utcOffset=7"

      - name: Verify file downloaded
        run: |
          if [ ! -s dist/productive-time.svg ]; then
            echo "Error: File is empty or download failed!"
            exit 1
          fi
          echo "File size: $(wc -c < dist/productive-time.svg) bytes"

      - name: Commit and push to dist/
        run: |
          git config user.name "RusdiEneri"
          git config user.email "nuruddinrusydiilham@gmail.com"
          git add dist/
          git diff --staged --quiet || git commit -m "chore: update productive-time card [skip ci]"
          git push
