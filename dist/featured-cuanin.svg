<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="126" viewBox="0 0 420 126" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<style>

        .card-bg {
            transition: stroke 0.2s ease, fill 0.2s ease;
        }
        .card-bg:hover {
            stroke: #404040;
            fill: #171717;
        }
        .pulse-dot {
            animation: pulseDot 2.4s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        @media (prefers-reduced-motion: reduce) {
            .pulse-dot { animation: none !important; opacity: 1 !important; }
        }
        
</style>
<a xlink:href="https://github.com/RusdiEneri/Cuanin" target="_blank" style="text-decoration:none; cursor:pointer;">
<rect class="card-bg" width="420" height="126" rx="4" fill="#141414" stroke="#262626" stroke-width="1"/>
<line x1="0" y1="0" x2="420" y2="0" stroke="#b38b6d" stroke-width="2"/>
<text x="18" y="24" fill="#b38b6d" font-size="9" font-weight="700" letter-spacing="0.8">RELATIONAL COMMERCE</text>
<circle cx="396" cy="20" r="3.5" fill="#b38b6d" class="pulse-dot"/>
<text x="18" y="47" fill="#f5f5f5" font-size="14.5" font-weight="700">Cuanin <tspan fill="#6e6e6e" font-size="12">↗</tspan></text>
<text x="18" y="68" fill="#9e9e9e" font-size="10.5" font-weight="400">Preloved marketplace with ACID transaction locking &amp; price bargaining.</text>
<g transform="translate(18, 90)"><rect width="79.0" height="20" rx="2" fill="#1a1a1a" stroke="#262626" stroke-width="1"/><text x="39.5" y="13.5" fill="#f5f5f5" font-size="9.5" font-weight="500" text-anchor="middle">Laravel 12</text></g>
<g transform="translate(103.0, 90)"><rect width="46.5" height="20" rx="2" fill="#1a1a1a" stroke="#262626" stroke-width="1"/><text x="23.2" y="13.5" fill="#f5f5f5" font-size="9.5" font-weight="500" text-anchor="middle">MySQL</text></g>
<g transform="translate(155.5, 90)"><rect width="92.0" height="20" rx="2" fill="#1a1a1a" stroke="#262626" stroke-width="1"/><text x="46.0" y="13.5" fill="#f5f5f5" font-size="9.5" font-weight="500" text-anchor="middle">Tailwind CSS</text></g>
</a>
</svg>