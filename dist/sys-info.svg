<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="316" viewBox="0 0 840 316" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, sans-serif">
<style>

        .pulse-dot {
            animation: pulseGlow 2.4s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.92); }
        }
        .cursor-blink {
            animation: cursorBlink 1.1s steps(2, start) infinite;
        }
        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .pulse-dot { animation: none !important; opacity: 1 !important; }
            .cursor-blink { animation: none !important; opacity: 1 !important; }
        }
        
</style>
