<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="210" viewBox="0 0 420 210" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"><style>
        @keyframes flowSweep {
            0% { transform: translateX(-350px) skewX(-20deg); }
            40%, 100% { transform: translateX(500px) skewX(-20deg); }
        }
        @keyframes pulseDot {
            0%, 100% { r: 3; opacity: 1; }
            50% { r: 4.5; opacity: 0.5; }
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        @keyframes accentBreathe {
            0%, 100% { opacity: 0.95; }
            50% { opacity: 0.55; }
        }
        .sweep-beam {
            animation: flowSweep 4.8s ease-in-out infinite;
        }
        .pulse-dot {
            animation: pulseDot 2.2s ease-in-out infinite;
        }
        .cursor {
            animation: blink 1.05s infinite;
        }
        .accent-bar {
            animation: accentBreathe 3s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .sweep-beam { display: none !important; }
            .pulse-dot { animation: none !important; }
        }
